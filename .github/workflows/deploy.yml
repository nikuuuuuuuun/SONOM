name: Deploy to GHCR

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Medusa Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/nikuuuuuuuun/sonom-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Storefront
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.storefront
          push: true
          tags: ghcr.io/nikuuuuuuuun/sonom-storefront:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
